name: Publish books.html to Gumroad

on:
  push:
    branches: [main]
    paths:
      - "books.html"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gumroad CLI
        run: curl -fsSL https://gumroad.com/install-cli.sh | bash

      - name: Publish profile page
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: gumroad user page publish books.html

      - name: Inspect the live page for the image tags and CSP
        run: |
          curl -sS -o /tmp/live.html "https://marcolombardo.gumroad.com"
          echo "--- byte size ---"
          wc -c /tmp/live.html
          echo "--- any occurrence of 'logo-ml' (raw or escaped) ---"
          grep -o '.\{0,40\}logo-ml.\{0,40\}' /tmp/live.html || echo "logo-ml NOT FOUND anywhere"
          echo "--- any occurrence of 'marco-portrait' (raw or escaped) ---"
          grep -o '.\{0,40\}marco-portrait.\{0,40\}' /tmp/live.html || echo "marco-portrait NOT FOUND anywhere"
          echo "--- any occurrence of 'marcolombardodev.github.io' ---"
          grep -o '.\{0,20\}marcolombardodev\.github\.io.\{0,20\}' /tmp/live.html | head -5 || echo "domain NOT FOUND anywhere"
          echo "--- does the page contain our brand text? ---"
          grep -o "Ideas, made to read" /tmp/live.html || echo "hero copy NOT FOUND"
