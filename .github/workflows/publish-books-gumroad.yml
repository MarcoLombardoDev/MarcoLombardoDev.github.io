name: Publish books.html to Gumroad

on:
  push:
    branches: [main]
    paths:
      - "books.html"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gumroad CLI
        run: curl -fsSL https://gumroad.com/install-cli.sh | bash

      - name: Publish profile page
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: gumroad user page publish books.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1 >/dev/null
          npx playwright install --with-deps chromium

      - name: Check the mobile nav width on the live page (no viewport meta survives publish)
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
          const page = await context.newPage();
          await page.goto('https://marcolombardo.gumroad.com', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(1000);
          for (const frame of page.frames()) {
            if (!frame.url().includes('/landing/embed')) continue;
            const info = await frame.evaluate(() => {
              const header = document.querySelector('.site-header');
              const nav = document.querySelector('.nav');
              return {
                innerWidth: window.innerWidth,
                headerPosition: header && getComputedStyle(header).position,
                headerWidth: header && header.getBoundingClientRect().width,
                navPosition: nav && getComputedStyle(nav).position,
                navWidth: nav && nav.getBoundingClientRect().width,
              };
            });
            console.log(frame.url(), JSON.stringify(info));
          }
          await browser.close();
          EOF
          node check.mjs
