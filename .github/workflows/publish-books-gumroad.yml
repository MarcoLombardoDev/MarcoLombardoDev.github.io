name: Publish books.html to Gumroad

on:
  push:
    branches: [main]
    paths:
      - "books.html"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gumroad CLI
        run: curl -fsSL https://gumroad.com/install-cli.sh | bash

      - name: Publish profile page
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: gumroad user page publish books.html

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1 >/dev/null
          npx playwright install --with-deps chromium

      - name: Check the viewport meta tag survived on the live embed frame
        run: |
          cat > check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          await page.goto('https://marcolombardo.gumroad.com', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(1000);
          for (const frame of page.frames()) {
            const meta = await frame.evaluate(() => {
              const m = document.querySelector('meta[name="viewport"]');
              return m ? m.getAttribute('content') : null;
            }).catch(e => `error: ${e.message}`);
            console.log(frame.url(), '-> viewport meta:', meta);
          }
          await browser.close();
          EOF
          node check.mjs
