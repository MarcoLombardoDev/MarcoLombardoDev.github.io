name: Publish books.html to Gumroad

on:
  push:
    branches: [main]
    paths:
      - "books.html"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gumroad CLI
        run: curl -fsSL https://gumroad.com/install-cli.sh | bash

      - name: Inspect the covers command shape (no removal yet)
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: |
          gumroad products covers --help
          echo "=== add --help ==="
          gumroad products covers add --help
          echo "=== current covers on the product (before) ==="
          PRODUCT_ID='6-WG6g8jVlQODOO-PRuqHw=='
          gumroad products view "$PRODUCT_ID" --json
