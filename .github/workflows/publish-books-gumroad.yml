name: Publish books.html to Gumroad

on:
  push:
    branches: [main]
    paths:
      - "books.html"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gumroad CLI
        run: curl -fsSL https://gumroad.com/install-cli.sh | bash

      - name: Publish profile page
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: gumroad user page publish books.html

      - name: Inspect the live page for the image tags and CSP
        run: |
          echo "--- response headers ---"
          curl -sS -D - -o /tmp/live.html "https://marcolombardo.gumroad.com" | grep -i "content-security-policy\|^HTTP"
          echo "--- logo/portrait <img> tags found in the live HTML ---"
          grep -o '<img[^>]*logo-ml[^>]*>' /tmp/live.html || echo "logo-ml <img> NOT FOUND"
          grep -o '<img[^>]*marco-portrait[^>]*>' /tmp/live.html || echo "marco-portrait <img> NOT FOUND"
