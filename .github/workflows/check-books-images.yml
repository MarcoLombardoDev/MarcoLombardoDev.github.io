name: Check books.html image links

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe every image URL used by books.html
        run: |
          grep -o 'https://[^"'"'"' )]*' books.html | grep -E 'public-files\.gumroad\.com|marcolombardodev\.github\.io/assets' | sort -u | while read u; do
            printf '%s  ' "$u"
            curl -s -o /dev/null -L -m 20 -w '%{http_code} %{content_type} %{size_download}\n' "$u"
          done
