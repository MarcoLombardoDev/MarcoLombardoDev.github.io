<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marco Lombardo</title>
<meta name="description" content="Marco Lombardo — personal site / sito personale.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#f2f1e0">

<link rel="alternate" hreflang="en" href="https://marcolombardodev.github.io/en/">
<link rel="alternate" hreflang="it" href="https://marcolombardodev.github.io/it/">
<link rel="alternate" hreflang="x-default" href="https://marcolombardodev.github.io/">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<noscript><meta http-equiv="refresh" content="0; url=it/"></noscript>

<style>
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    gap: 28px;
    background: radial-gradient(120% 90% at 50% 35%, #fcfcf6 0%, #f2f1e0 45%, #d7e0ca 100%);
    color: #2b2929;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center;
    padding: 32px;
    box-sizing: border-box;
  }
  .logo-img { width: 160px; height: auto; }
  .logo-svg { display: none; width: 120px; height: 80px; }
  .no-logo-file .logo-img { display: none; }
  .no-logo-file .logo-svg { display: block; }
  p { color: #484f4f; margin: 0; font-size: 15px; letter-spacing: .04em; }
  .choose { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .choose a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 220px;
    padding: 13px 26px;
    border-radius: 999px;
    border: 1px solid rgba(46,44,44,.26);
    background: rgba(252,252,246,.7);
    color: #2b2929;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    text-decoration: none;
    transition: background .2s, border-color .2s, transform .2s;
  }
  .choose a:hover { background: rgba(231,49,30,.12); border-color: #e7311e; transform: translateY(-2px); }
</style>
</head>

<body>
  <img class="logo-img" src="assets/img/logo-ml.png" alt="Marco Lombardo"
       onerror="document.documentElement.classList.add('no-logo-file')">
  <svg class="logo-svg" viewBox="0 0 240 160" role="img" aria-label="Marco Lombardo">
    <g transform="skewX(-8) translate(10 0)" fill="none" stroke="#e7311e" stroke-width="21" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 132C26 92 40 52 56 52c14 0 10 40 6 80 8-40 22-80 38-80 14 0 8 44 4 80"/>
      <path d="M104 132c14-36 46-112 72-112 20 0 14 40-14 76-22 28-30 42-16 44 16 2 46-22 68-48"/>
    </g>
  </svg>

  <p>Marco Lombardo</p>

  <!-- Shown only if the automatic redirect does not run (no JS, or an unexpected error). -->
  <div class="choose">
    <a href="it/" hreflang="it" lang="it">Continua in italiano</a>
    <a href="en/" hreflang="en">Continue in English</a>
  </div>

<script>
/* Language router.
   Priority: 1) ?lang= in the URL  2) the language chosen previously
             3) the browser language  4) Italian as the default. */
(function () {
  "use strict";

  var SUPPORTED = { it: "it/", en: "en/" };
  var STORAGE_KEY = "ml-lang";
  var choice = null;

  // 1. explicit override: /?lang=it
  var q = /[?&]lang=([a-zA-Z-]+)/.exec(window.location.search);
  if (q) {
    var forced = q[1].slice(0, 2).toLowerCase();
    if (SUPPORTED[forced]) {
      choice = forced;
      try { localStorage.setItem(STORAGE_KEY, forced); } catch (e) {}
    }
  }

  // 2. previously chosen language
  if (!choice) {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved && SUPPORTED[saved]) choice = saved;
    } catch (e) {}
  }

  // 3. browser language: English goes to /en/, anything else to /it/
  if (!choice) {
    var list = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language || navigator.userLanguage || "it"];
    var primary = String(list[0] || "it").slice(0, 2).toLowerCase();
    choice = primary === "en" ? "en" : "it";
  }

  window.location.replace(SUPPORTED[choice] || "it/");
})();
</script>
</body>
</html>
